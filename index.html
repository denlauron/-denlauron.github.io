
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>CHRIS | Digital Contact Card</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:30px 18px;
 display:flex;justify-content:center;align-items:center;
 background:radial-gradient(circle at top,#193453,#090d18 65%);
 color:white;font-family:Arial,sans-serif
}
.card{
 width:100%;max-width:390px;padding:30px 22px;
 border:1px solid #26364b;border-radius:24px;
 background:#101929;box-shadow:0 20px 60px #0008;
 text-align:center
}
.avatar{
 width:76px;height:76px;margin:auto;display:grid;
 place-items:center;border-radius:50%;
 background:#1e3a5b;border:1px solid #42668c;
 color:#60a5fa;font-size:32px;font-weight:bold
}
h1{margin:17px 0 5px;letter-spacing:4px}
.subtitle{color:#94a3b8;font-size:11px;letter-spacing:2px;margin-bottom:28px}
.section{
 padding:18px;margin-bottom:16px;border:1px solid #29384e;
 border-radius:16px;background:#172033
}
.link{
 display:flex;align-items:center;gap:13px;padding:12px 0;
 color:white;text-decoration:none;text-align:left
}
.link-icon{
 width:38px;height:38px;display:grid;place-items:center;
 border-radius:10px;background:#263b58;color:#60a5fa;font-size:19px
}
.link-info{flex:1}
.link-info strong,.link-info small{display:block}
.link-info small{color:#94a3b8;margin-top:4px}
.qr-section h2{font-size:18px}
.qr-section p{color:#94a3b8;font-size:12px}
.qr-image{
 display:block;width:100%;max-width:230px;height:auto;
 margin:15px auto;background:white;border-radius:10px
}
.number{display:block;margin-top:15px;font-size:20px;font-weight:bold}
button{
 margin-top:12px;padding:12px 20px;border:0;border-radius:9px;
 background:#2563eb;color:white;font-weight:bold;cursor:pointer
}
footer{margin-top:25px;color:#64748b;font-size:10px;letter-spacing:2px}
</style>
</head>
<body>
<main class="card">
 <div class="avatar">C</div>
 <h1>CHRIS</h1>
 <div class="subtitle">MY DIGITAL CONTACT CARD</div>

 <section class="section">
  <a class="link" href="https://www.facebook.com/chrislauron02/"
     target="_blank" rel="noopener noreferrer">
   <span class="link-icon">f</span>
   <span class="link-info">
    <strong>Facebook</strong>
    <small>Visit my profile</small>
   </span>
   <span>↗</span>
  </a>
 </section>

 <section class="section qr-section">
  <h2>Send me a payment</h2>
  <p>Scan my GCash QR code</p>
  <img class="qr-image" src="gcash-qr.jpg" alt="CHRIS GCash QR Code">
  <span class="number">0931 026 3579</span>
  <button onclick="copyNumber()">Copy GCash Number</button>
 </section>

 <footer>THANK YOU FOR VISITING</footer>
</main>

<script>
function copyNumber(){
 navigator.clipboard.writeText("09310263579")
 .then(()=>alert("GCash number copied!"))
 .catch(()=>alert("Please copy: 09310263579"));
}
</script>
</body>
</html>
