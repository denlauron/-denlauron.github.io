
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080D19">
<title>CHRIS | Digital Contact Card</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top, #193b60, #080d19 65%);
  color: white;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 410px;
  padding: 30px 22px;
  background: rgba(16,25,41,.97);
  border: 1px solid #293c55;
  border-radius: 25px;
  box-shadow: 0 25px 70px #0009;
  text-align: center;
  animation: appear .8s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.tag {
  color: #60a5fa;
  font-size: 10px;
  letter-spacing: 3px;
}

.avatar {
  width: 100px;
  height: 100px;
  margin: 18px auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg,#315b85,#13263e);
  border: 2px solid #60a5fa;
  box-shadow: 0 0 30px #3b82f644;
  font-size: 42px;
  font-weight: bold;
}

h1 {
  margin: 8px 0;
  letter-spacing: 5px;
  font-size: 30px;
}

.subtitle {
  color: #94a3b8;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 25px;
}

.section {
  padding: 19px;
  margin-bottom: 17px;
  background: #17243a;
  border: 1px solid #2c405b;
  border-radius: 17px;
}

.link {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 8px 0;
  color: white;
  text-decoration: none;
  text-align: left;
}

.link-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  background: #263e5e;
  border-radius: 12px;
  color: #60a5fa;
  font-size: 21px;
  font-weight: bold;
}

.link-info { flex: 1; }

.link-info strong { display: block; }

.link-info small {
  display: block;
  margin-top: 4px;
  color: #94a3b8;
}

.arrow { color: #94a3b8; }

h2 {
  font-size: 19px;
  margin: 0 0 8px;
}

.description {
  color: #94a3b8;
  font-size: 12px;
  margin-bottom: 17px;
}

.qr-image {
  display: block;
  width: 100%;
  max-width: 230px;
  height: auto;
  margin: 15px auto;
  padding: 6px;
  background: white;
  border-radius: 12px;
}

.number {
  display: block;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 1px;
  margin: 15px 0;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 9px;
  border: 1px solid #42668c;
  border-radius: 11px;
  background: #213d5e;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #315b85;
  transform: translateY(-2px);
}

.save-button {
  background: linear-gradient(120deg,#2563eb,#1d4ed8);
  border: none;
  padding: 15px;
}

footer {
  margin-top: 25px;
  color: #64748b;
  font-size: 10px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<main class="card">

  <div class="tag">DIGITAL BUSINESS CARD</div>

  <div class="avatar">C</div>

  <h1>CHRIS</h1>
  <div class="subtitle">CONNECT WITH ME</div>

  <section class="section">

    <a class="link"
       href="https://www.facebook.com/chrislauron02/"
       target="_blank"
       rel="noopener noreferrer">

      <span class="link-icon">f</span>

      <span class="link-info">
        <strong>Facebook</strong>
        <small>Visit my profile</small>
      </span>

      <span class="arrow">↗</span>
    </a>

  </section>

  <section class="section">

    <h2>My GCash</h2>
    <p class="description">Scan my QR code to send payment</p>

    <img
      class="qr-image"
      src="gcash-qr.jpg"
      alt="CHRIS GCash QR Code"
    >

    <span class="number">0931 026 3579</span>

    <button onclick="copyNumber()">
      Copy GCash Number
    </button>

  </section>

  <button class="save-button" onclick="saveContact()">
    ♡ &nbsp; SAVE MY CONTACT
  </button>

  <footer>
    THANK YOU FOR CONNECTING
  </footer>

</main>

<script>
function copyNumber() {
  navigator.clipboard.writeText("09310263579")
    .then(() => alert("GCash number copied!"))
    .catch(() => alert("Copy this number: 09310263579"));
}

function saveContact() {
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "FN:CHRIS",
    "TEL;TYPE=CELL:09310263579",
    "URL:https://www.facebook.com/chrislauron02/",
    "END:VCARD"
  ].join("\r\n");

  const blob = new Blob([vcard], {
    type: "text/vcard;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "CHRIS.vcf";
  link.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
